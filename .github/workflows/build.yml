name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AndroidIcons.apk
          gh release create "v$VERSION" AndroidIcons.apk \
            --target "$GITHUB_SHA" \
            --title "Android Icons $VERSION" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Open this page on your phone, tap **AndroidIcons.apk** and install it."
